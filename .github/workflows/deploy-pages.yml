name: Build and Deploy Web Game

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show emcc version
        run: emcc --version

      - name: List sources
        run: |
          pwd
          ls -la
          cat ci/wasm_exports.json

      - name: Compile WASM
        run: |
          emcc -std=c99 -O2 \
            main_web.c platform_web.c \
            init.c snake.c queue.c stack.c board.c memory.c game_ui.c game_config.c obstacles.c score.c audio.c level.c editor.c \
            -o web/snake.js \
            -s WASM=1 \
            -s ENVIRONMENT=web \
            -s NO_EXIT_RUNTIME=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s "EXPORTED_FUNCTIONS=['_malloc','_free','_main','_web_send_key','_web_restart','_web_set_mode','_web_start_editor','_web_get_score','_web_is_game_over','_web_get_mode_name','_web_load_level_text']" \
            -s "EXPORTED_RUNTIME_METHODS=['ccall','cwrap','UTF8ToString','lengthBytesUTF8','stringToUTF8']" \
            -s ASSERTIONS=1

      - name: List output
        run: ls -la web/snake.js web/snake.wasm

      - name: Inject GitHub repository link
        run: |
          REPO="${{ github.server_url }}/${{ github.repository }}"
          sed -i "s|<head>|<head>\n  <meta name=\"github-repo\" content=\"${REPO}\">|" web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
